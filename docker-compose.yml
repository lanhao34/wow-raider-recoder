services:
  postgres:
    image: postgres:16-alpine
    container_name: guild_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guilduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guildpass}
      POSTGRES_DB: ${POSTGRES_DB:-guilddb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guilduser} -d ${POSTGRES_DB:-guilddb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: guild_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guilduser}:${POSTGRES_PASSWORD:-guildpass}@postgres:5432/${POSTGRES_DB:-guilddb}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: guild_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
