services:
  postgres:
    image: postgres:16-alpine
    container_name: guild_postgres_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guilduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guildpass123}
      POSTGRES_DB: ${POSTGRES_DB:-guilddb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guilduser} -d ${POSTGRES_DB:-guilddb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dev_server:
    image: node:20-alpine
    container_name: guild_dev_server
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-guilduser}:${POSTGRES_PASSWORD:-guildpass123}@postgres:5432/${POSTGRES_DB:-guilddb}
      - JWT_SECRET=${JWT_SECRET:-devsecret_local2026}
      - PORT=3001
      - CI=true
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        apk add --no-cache openssl &&
        npm config set registry https://registry.npmmirror.com &&
        npm install -g pnpm &&
        pnpm config set registry https://registry.npmmirror.com &&
        echo 'Installing dependencies...' &&
        pnpm install &&
        echo 'Syncing database schema...' &&
        cd packages/backend && pnpm exec prisma db push && cd ../.. &&
        echo 'Starting dev servers...' &&
        pnpm exec concurrently \"pnpm --filter backend dev\" \"pnpm --filter frontend dev -- --host 0.0.0.0\"
      "

volumes:
  postgres_data_dev:
